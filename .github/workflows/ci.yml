name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Bot branches get CI on push: the bots open no PRs (no gh token), so
    # this is the only CI a slice sees before it is merged.
    branches: [main, "scout/**", "lookout/**", "nitpick/**", "hermes/**"]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          extra_args: --results=verified,unknown

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # Reproducibility is checked on every pull request, not only at release.
      # It breaks by someone dropping a build flag, and that is a code review
      # away from shipping — catching it at tag time means catching it when a
      # release is already half out.
      - name: Reproducible builds
        run: ./scripts/check-reproducible.sh

      - name: govulncheck
        # govulncheck's own go.mod can require a newer Go than this repo's
        # pinned toolchain (go.mod's `go`/`toolchain` directives). Scope
        # GOTOOLCHAIN=auto to just this step so it can fetch what it needs
        # without changing the toolchain used to build the project itself.
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: defendsec
          POSTGRES_PASSWORD: defendsec
          POSTGRES_DB: defendsec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U defendsec -d defendsec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test against Postgres
        env:
          TEST_DATABASE_URL: postgres://defendsec:defendsec@localhost:5432/defendsec?sslmode=disable
        # Every package whose tests skip without a database. internal/control
        # was missing here, which meant the guarantees Phase 1 and Phase 4
        # exist to make — per-user attribution, an agent being unable to sign,
        # autonomy staying inside its bounds — had tests that ran locally and
        # silently skipped in CI. A guarantee whose test never runs is not a
        # guarantee, so this list is asserted rather than maintained by
        # memory: see TestEveryIntegrationPackageRunsInCI.
        #
        # -p 1 runs the packages one at a time. They share a database, and
        # migration DDL takes ACCESS EXCLUSIVE on audit_log while an audit
        # append holds it, so running them concurrently can deadlock.
        run: go test -p 1 -count=1 ./internal/storepg/... ./db/migrations/... ./internal/control/... ./internal/feeds/runner/... ./internal/rmm/...

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: npm audit (high+ severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  # Provisioning integrations (roadmap 5.6). Checked here because nothing else
  # exercises them: a role or module that stops parsing would otherwise be
  # found by the first operator to use it.
  provisioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform module
        working-directory: packaging/terraform/defendsec-agent
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate
          terraform test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ansible role
        working-directory: packaging/ansible
        run: |
          # Pinned so tool releases cannot change the result unannounced.
          # The `ansible` package bundles ansible.windows, so the galaxy step
          # below finds requirements.yml already satisfied and needs no network
          # (galaxy.ansible.com artifact downloads returned HTTP 500 on
          # 2026-10-24, which failed this step). Bump both pins together and
          # rerun the lint. Galaxy is flaky, so the install retries.
          pip install ansible==14.5.0 ansible-lint==26.10.1
          for attempt in 1 2 3; do
            ansible-galaxy collection install -r requirements.yml && break
            if [ "$attempt" = 3 ]; then echo "galaxy install failed 3 times"; exit 1; fi
            sleep $((attempt * 10))
          done
          printf '[defendsec_agents]\nh1\n' > /tmp/inventory
          ansible-playbook -i /tmp/inventory playbooks/agents.yml --syntax-check
          ansible-lint --offline roles/ playbooks/
      - name: Scripts parse under PowerShell
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem packaging/agent/*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Error "$($f.Name): $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }
