syntax = "proto3";

package defendsec.v1;

option go_package = "defendsec/internal/gen/defendsec/v1;defendsecv1";

service AgentControl {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportInventory(InventoryReport) returns (HeartbeatResponse);
  rpc Connect(stream AgentToServer) returns (stream ServerToAgent);
}

message HeartbeatRequest {
  string hostname = 1;
  string os_name = 2;
  string os_version = 3;
  string arch = 4;
  string platform = 5;
  int64 uptime_seconds = 6;
  // 7 was `isolated` (host network isolation, removed in slice 6). Old agents
  // may still send it; it is ignored.
  reserved 7;
  reserved "isolated";
  // Windows edition: the EditionID registry value ("ServerStandard",
  // "EnterpriseS", "Professional", ...). Client, server and LTSC editions share
  // build numbers and have different support dates, so a build alone cannot
  // say whether a Windows host is supported. Optional: empty from other
  // platforms and from older agents, and the console then reads the edition
  // from the OS caption where it can and otherwise reports "unknown".
  string os_edition = 8;
}

message HeartbeatResponse {
  bool ok = 1;
  int64 server_time_unix = 2;
}

message SoftwareItem {
  string name = 1;
  string version = 2;
  // Source package the binary was built from (dpkg Source:, rpm SOURCERPM), and
  // its version when the package manager reports one that differs from the
  // binary's. Optional: agents older than the distro-aware matcher leave both
  // empty and the server falls back to the binary name and version.
  string source_package = 3;
  string source_version = 4;
  // Where the package came from, read without changing anything: the apt
  // Origin: of the repository that carries the installed version (from
  // `apt-cache policy`), or the rpm Vendor. origin_repo is the repository URL
  // (credentials removed) or the rpm Packager. Optional: agents older than
  // application end-of-life reporting leave both empty, and the server then
  // does not judge the package, because origin decides whether an upstream
  // end-of-life date applies.
  string origin = 5;
  string origin_repo = 6;
}

message PendingUpdate {
  string name = 1;
  string current = 2;
  string available = 3;
}

// What the agent read about one enabled package repository, without refreshing
// or changing anything (slice 11). Times are Unix seconds; 0 is "not given".
message RepoHealthRepo {
  string id = 1;
  string label = 2;
  string uri = 3;
  string suite = 4;
  string source = 5;
  // good, expired_key, no_pubkey, bad_signature, revoked_key, unsigned,
  // no_index, not_checked or unverified.
  string signature = 6;
  string key_id = 7;
  string detail = 8;
  string signed_by = 9;
  int64 release_date_unix = 10;
  int64 valid_until_unix = 11;
  bool ignore_valid_until = 12;
  int64 metadata_unix = 13;
  int64 key_expires_unix = 14;
}

// The host's repositories as the agent found them. The server judges it (key
// problems, stale indexes, whether pending updates can be believed), so the
// staleness threshold is one setting for the fleet. Optional: agents older than
// repository-health reporting send none, and the server then says "not
// assessed" rather than "healthy".
message RepoHealthReport {
  // apt, dnf or zypper; empty when the agent does not read this host's manager.
  string manager = 1;
  int64 last_refresh_unix = 2;
  string last_refresh_source = 3;
  repeated RepoHealthRepo repos = 4;
  // Checks the agent could not make, one reason each.
  repeated string limits = 5;
}

message FimFile {
  string path = 1;
  string sha256 = 2;
  int64 size = 3;
  string mtime = 4;
}

message ScaResult {
  string pack_id = 1;
  string check_id = 2;
  string title = 3;
  string severity = 4;
  bool pass = 5;
  string detail = 6;
}

message InventoryReport {
  HeartbeatRequest host = 1;
  string serial = 2;
  string hardware_model = 3;
  string cpu = 4;
  int64 memory_mb = 5;
  // 0 unknown, 1 false, 2 true
  int32 disk_encryption = 6;
  int32 firewall = 7;
  repeated string ip_addresses = 8;
  string username = 9;
  repeated SoftwareItem software = 10;
  repeated PendingUpdate pending_updates = 11;
  string patch_inventory = 12;
  repeated FimFile fim = 13;
  repeated ScaResult sca_results = 14;
  // os-release ID and VERSION_ID ("ubuntu"/"22.04", "rocky"/"9.4"), and the
  // package manager that produced `software` ("dpkg" or "rpm"). Optional:
  // empty from older agents and on platforms without os-release.
  string distro = 15;
  string distro_release = 16;
  string package_manager = 17;
  RepoHealthReport repo_health = 18;
}

message Hello {
  string hostname = 1;
  string agent_version = 2;
}

// Signed with the agent's enrolled certificate key (ECDSA P-256) over a
// canonical encoding of command_id, device_id, accepted, result_hash and
// executed_unix. Without it the endpoint's claim to have executed a command
// carries no proof of origin once it leaves the mTLS channel, so "sent" could
// never be distinguished from "done" after the fact.
//
// Older agents send no signature; the server records the acknowledgement as
// unattested rather than rejecting it.
message CommandAck {
  string command_id = 1;
  bool accepted = 2;
  string message = 3;
  // SHA-256 of message, so the proof covers the result without the signature
  // growing with it.
  string result_hash = 4;
  int64 executed_unix = 5;
  bytes signature = 6;
}

message AgentToServer {
  string request_id = 1;
  // 5 was `events` (behavioural telemetry, removed in slice 6).
  reserved 5;
  reserved "events";
  oneof body {
    HeartbeatRequest heartbeat = 2;
    CommandAck ack = 3;
    Hello hello = 4;
  }
}

message Ping {
  int64 server_time_unix = 1;
}

// Signed with the control-plane Ed25519 key. Agents ignore unsigned commands.
message ControlCommand {
  string command_id = 1;
  string type = 2;
  bytes payload = 3;
  bytes signature = 4;
  int64 issued_unix = 5;
  int64 expires_unix = 6;
  string device_id = 7;
}

message ServerToAgent {
  string request_id = 1;
  oneof body {
    Ping ping = 2;
    ControlCommand command = 3;
  }
}
