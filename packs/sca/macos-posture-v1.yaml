id: macos-posture
name: macOS posture baseline
platform: darwin
# Posture checks (roadmap 5.2), collected with fdesetup, socketfilterfw,
# csrutil, spctl and defaults (internal/posture/darwin.go). fdesetup needs root,
# which the agent has. A probe that could not run produces no result.
checks:
  - id: filevault
    title: FileVault is on
    severity: high
    type: posture
    probe: filevault_enabled
    controls:
      - nist-800-53:SC-28
      - cis-v8:3.11
      - nist-800-171:3.13.16
      - cjis-v6:10
  - id: application-firewall
    title: Application firewall is on
    severity: medium
    type: posture
    probe: application_firewall_enabled
    controls:
      - nist-800-53:CM-6
      - cis-v8:4.1
      - nist-800-171:3.4.2
      - cjis-v6:10
  - id: firewall-stealth
    title: Firewall stealth mode is on
    severity: low
    type: posture
    probe: firewall_stealth_mode
    controls:
      - nist-800-53:CM-6
      - cis-v8:4.1
      - nist-800-171:3.4.2
      - cjis-v6:10
  - id: sip
    title: System Integrity Protection is fully on
    severity: high
    type: posture
    probe: system_integrity_protection
    controls:
      - nist-800-53:SI-7
      - nist-800-53:CM-6
      - nist-800-171:3.4.2
      - cjis-v6:10
  - id: gatekeeper
    title: Gatekeeper is on
    severity: medium
    type: posture
    probe: gatekeeper_enabled
    controls:
      - nist-800-53:SI-7
      - nist-800-53:CM-6
      - nist-800-171:3.4.2
      - cjis-v6:10
  - id: xprotect-present
    title: XProtect is installed
    severity: high
    type: posture
    probe: xprotect_present
    controls:
      - cis-v8:10.1
      - nist-800-171:3.14.2
      - cjis-v6:10
  - id: security-data-updates
    title: XProtect and security updates install automatically
    severity: medium
    type: posture
    probe: security_data_auto_install
    controls:
      - cis-v8:10.1
      - nist-800-171:3.14.2
      - nist-800-53:SI-2
      - cjis-v6:10
  - id: automatic-login-disabled
    title: Automatic login is disabled
    severity: high
    type: posture
    probe: automatic_login_disabled
    controls:
      - nist-800-53:IA-2
      - nist-800-171:3.1.1
      - cjis-v6:6
      - nist-800-53:SC-28
