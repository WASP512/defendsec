id: sca-linux-host-v1
name: Linux host baseline (Fedora/RHEL-friendly)
platform: linux
# Control tags (roadmap 1.7). Each check names the framework controls it
# actually tests, so a finding is evidence against a control rather than an
# untagged row a report has to guess at later. A bad identifier fails the
# pack load: a pack that looks tagged but evidences nothing is the failure
# mode hardest to notice and worst to discover during an audit.
checks:
  - id: firewall-enabled
    controls:
      - nist-800-53:CM-6
      - nist-800-53:SC-8
      - cis-v8:4.1
      - nist-800-171:3.4.2
      - cjis-v6:10
    title: Host firewall reported enabled
    severity: medium
    type: inventory_field
    field: firewall
    expect: "true"
  - id: disk-encryption
    controls:
      - nist-800-53:SC-28
      - cis-v8:3.11
      - nist-800-171:3.13.16
      - cjis-v6:10
    title: Disk encryption reported enabled
    severity: high
    type: inventory_field
    field: diskEncryption
    expect: "true"
  - id: crypto-policies-config
    controls:
      - nist-800-53:SC-13
      - nist-800-53:CM-6
      - nist-800-171:3.13.11
      - cjis-v6:10
    title: System crypto-policies config present (Fedora/RHEL)
    severity: low
    type: file_regex
    path: /etc/crypto-policies/config
    must_match: '(?i)^(DEFAULT|FUTURE|FIPS|NEXT)'
  - id: sshd-password-auth-host
    controls:
      - nist-800-53:CM-6
      - nist-800-53:AC-3
      - nist-800-53:IA-2
      - cis-v8:4.1
      - nist-800-171:3.4.2
      - cjis-v6:6
    title: PasswordAuthentication should be no (sshd + drop-ins)
    severity: high
    type: file_regex
    path: /etc/ssh/sshd_config
    must_match: '(?i)^PasswordAuthentication\s+no'
  - id: sshd-permit-root
    controls:
      - nist-800-53:CM-6
      - nist-800-53:AC-6(9)
      - cis-v8:5.4
      - nist-800-171:3.1.5
      - cjis-v6:5
    title: PermitRootLogin should be no or prohibit-password
    severity: high
    type: file_regex
    path: /etc/ssh/sshd_config
    must_match: '(?i)^PermitRootLogin\s+(no|prohibit-password|without-password)'
