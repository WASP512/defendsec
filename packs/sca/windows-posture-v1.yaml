id: windows-posture
name: Windows posture baseline
platform: windows
# Posture checks (roadmap 5.1). Each probe is collected once per report by a
# single PowerShell script (internal/posture/windows.go). A probe that could
# not run produces no result: missing evidence, not a pass or a failure.
checks:
  - id: bitlocker-os-volume
    title: BitLocker protection is on for the system volume
    severity: high
    type: posture
    probe: bitlocker_os_volume
    controls:
      - nist-800-53:SC-28
      - cis-v8:3.11
      - nist-800-171:3.13.16
      - cjis-v6:10
  - id: defender-antivirus
    title: Microsoft Defender Antivirus is enabled
    severity: high
    type: posture
    probe: defender_antivirus_enabled
    controls:
      - cis-v8:10.1
      - nist-800-171:3.14.2
      - cjis-v6:10
  - id: defender-realtime
    title: Defender real-time protection is on
    severity: high
    type: posture
    probe: defender_realtime_protection
    controls:
      - cis-v8:10.1
      - nist-800-171:3.14.2
      - cjis-v6:10
  - id: defender-signatures
    title: Defender definitions are no more than 3 days old
    severity: medium
    type: posture
    probe: defender_signatures_current
    controls:
      - cis-v8:10.1
      - nist-800-171:3.14.2
      - nist-800-53:SI-2
      - cjis-v6:10
  - id: defender-tamper
    title: Defender tamper protection is on
    severity: medium
    type: posture
    probe: defender_tamper_protection
    controls:
      - cis-v8:10.1
      - nist-800-171:3.14.2
      - cjis-v6:10
  - id: firewall-all-profiles
    title: Windows Firewall is on for every profile
    severity: medium
    type: posture
    probe: firewall_all_profiles
    controls:
      - nist-800-53:CM-6
      - cis-v8:4.1
      - nist-800-171:3.4.2
      - cjis-v6:10
  - id: smbv1-disabled
    title: SMBv1 server protocol is disabled
    severity: high
    type: posture
    probe: smbv1_disabled
    controls:
      - nist-800-53:CM-6
      - cis-v8:4.1
      - nist-800-171:3.4.2
      - cjis-v6:7
  - id: uac-enabled
    title: User Account Control is on
    severity: medium
    type: posture
    probe: uac_enabled
    controls:
      - nist-800-53:CM-6
      - cis-v8:4.1
      - nist-800-171:3.4.2
      - cjis-v6:7
  - id: rdp-nla
    title: Remote Desktop requires Network Level Authentication (or is off)
    severity: medium
    type: posture
    probe: rdp_requires_nla
    controls:
      - nist-800-53:IA-2
      - nist-800-171:3.1.1
      - cjis-v6:6
      - nist-800-53:CM-6
