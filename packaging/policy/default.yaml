# DefendSec response policy (roadmap 2.1).
#
# Deny by default: a command is refused unless a rule below permits it, and an
# explicit deny always wins regardless of where it sits in the file. A command
# policy refuses is never signed, so it cannot be executed even by something
# that bypasses the console entirely.
#
# This file is meant to live in version control. "Who changed this rule, and
# when" is the first question asked after a command that should not have been
# permitted, and a policy editable only through a web form has no answer.
#
# Start here, then tighten. Every rule below is a decision somebody should
# actually agree with rather than a default nobody read.

version: 1
name: default
# Time windows are interpreted in this zone. UTC rather than the server's local
# zone: a policy whose meaning depends on where the machine sits is one nobody
# can review.
timezone: UTC

rules:
  # --- Investigation ---------------------------------------------------
  # Reading a host's state does not change it, so it is permitted broadly.
  # This is what an operator reaches for first, and making it require approval
  # trains people to use break-glass for routine work.
  - id: admins-may-investigate
    effect: permit
    commands: [live_query]
    roles: [admin]

  # --- Containment ------------------------------------------------------
  # Isolating an ordinary host is reversible and is the correct first response
  # to a confirmed compromise, so one administrator may do it.
  - id: isolate-ordinary-hosts
    effect: permit
    commands: [isolate, release]
    roles: [admin]
    exclude_host_classes: [production, critical, domain-controller]

  # Isolating production takes a service down. That is sometimes right, and it
  # should be somebody's considered decision rather than a reflex, so it needs
  # a second administrator.
  - id: isolate-production-needs-two
    effect: permit
    commands: [isolate]
    roles: [admin]
    host_classes: [production]
    require_approvals: 2

  # Critical hosts and domain controllers can still be isolated — with two
  # administrators. Isolation is reversible and is the *safer* response on
  # exactly these hosts, since the alternative rules below forbid killing
  # processes and touching files there. Leaving them with no response at all
  # would push an operator straight to break-glass.
  - id: isolate-critical-needs-two
    effect: permit
    commands: [isolate]
    roles: [admin]
    host_classes: [critical, domain-controller]
    require_approvals: 2

  # Releasing is always allowed on one approval: recovering from an isolation
  # must never be harder than causing one.
  - id: release-anything
    effect: permit
    commands: [release]
    roles: [admin]

  # --- Remediation ------------------------------------------------------
  - id: quarantine-and-script-on-ordinary-hosts
    effect: permit
    commands: [run_script, quarantine_path]
    roles: [admin]
    exclude_host_classes: [critical, domain-controller]

  - id: kill-process-on-ordinary-hosts
    effect: permit
    commands: [kill_process]
    roles: [admin]
    exclude_host_classes: [critical, domain-controller]

  # --- Never ------------------------------------------------------------
  # A domain controller losing a process or a file takes authentication down
  # for the estate, and the blast radius is far wider than the incident being
  # responded to. Isolating one is still available, and is the safer tool.
  - id: never-disrupt-domain-controllers
    effect: deny
    commands: [kill_process, quarantine_path, run_script]
    host_classes: [domain-controller]
    reason: >-
      A domain controller losing a process or a file takes estate-wide
      authentication down, which is almost always worse than the incident.
      Isolate it instead, or change this rule deliberately.

  # --- Maintenance ------------------------------------------------------
  # Agent updates restart the agent. Confining them to a window keeps a routine
  # action from coinciding with an incident nobody has finished investigating.
  - id: agent-updates-in-hours
    effect: permit
    commands: [agent_update]
    roles: [admin]
    window:
      hours: "09:00-17:00"
      days: [mon, tue, wed, thu, fri]

  # AI agents (roadmap 4.1). Deny-by-default extends to them: without a rule
  # naming the agent role, a registered agent can read the fleet and propose
  # nothing successfully.
  #
  # This permits proposals only. Every one is recorded unsigned and needs a
  # human approval, whatever this rule says, because an agent's own approval
  # never counts.
  - id: agents-may-propose-containment
    effect: permit
    roles: [agent]
    commands: [isolate, quarantine_path]

  # Read-only queries, in their own rule so bounded autonomy (roadmap 4.4) can
  # be switched on here with a one-line change.
  #
  # Uncomment `autonomous: true` below to let an agent run live queries with
  # no human in the loop. A read-only query is the right first thing to
  # automate: the worst outcome of getting it wrong is noise, not an outage.
  # It is capped at 20 an hour fleet-wide by query-fleet-hourly, and an
  # autonomous rule with no covering limit is refused at load.
  #
  # It still needs the second switch. The principal must have autonomy
  # enabled on it as well:
  #
  #   curl -X POST -H "Authorization: Bearer $DEFENDSEC_ADMIN_TOKEN" \
  #     -H 'content-type: application/json' \
  #     -d '{"name":"triage","enabled":true}' \
  #     http://127.0.0.1:47264/v1/agents/autonomy
  #
  # Put autonomy on the only rule matching a command, not alongside an
  # existing permit: where two permits match, the one withholding autonomy
  # wins, so a broad non-autonomous rule silently shadows a narrower
  # autonomous one. That is why live_query has a rule of its own here rather
  # than sharing the containment rule above.
  #
  # Consider adding `exclude_host_classes: [critical, domain-controller]` to
  # this rule before enabling autonomy, so unattended queries stay off the
  # hosts where surprises cost most.
  #
  # Note what is deliberately absent: no autonomous rule for isolate. An agent
  # that can take hosts off the network unattended is a denial-of-service tool
  # with good intentions, and that is not something to ship switched on or to
  # suggest casually.
  - id: agents-may-query
    effect: permit
    roles: [agent]
    commands: [live_query]
    # autonomous: true

limits:
  # Every command an autonomous rule names must be covered by a limit, or the
  # policy is refused at load. The autonomy example above relies on
  # query-fleet-hourly below.

  # Fleet-wide rather than per-host. A per-host limit would happily isolate the
  # whole estate one host at a time, which is exactly the runaway this exists
  # to stop.
  - id: isolate-fleet-hourly
    commands: [isolate]
    scope: fleet
    max: 5
    per: 1h

  # Killing processes repeatedly on one host is either a loop or a mistake.
  - id: kill-per-host
    commands: [kill_process]
    scope: host
    max: 5
    per: 15m

  # Scripts and quarantines change state and are the easiest to get wrong at
  # scale, so they are capped tightly fleet-wide.
  - id: state-changing-fleet-hourly
    commands: [run_script, quarantine_path]
    scope: fleet
    max: 10
    per: 1h

  # Live queries are read-only, so the cap is generous — but it exists,
  # because an autonomous rule with no ceiling is refused at load and because
  # a loop hammering the fleet with queries is still a loop.
  - id: query-fleet-hourly
    commands: [live_query]
    scope: fleet
    max: 20
    per: 1h
